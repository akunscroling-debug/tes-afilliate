<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Affiliate Dashboard — Sistem Uang Berputar</title>

<style>
:root {
  --bg:#f3fbff; --card:#e6f7ff; --accent:#66c2ff; --accent-2:#8fd6ff;
  --muted:#6b8596; --glass:rgba(255,255,255,0.6); --success:#23c48a;
  --danger:#ff6b6b; font-family: Inter, system-ui, sans-serif;
}

*{box-sizing:border-box}
body {margin:0; background:linear-gradient(180deg,var(--bg),#eef9ff); color:#083042}

.container{max-width:1100px;margin:28px auto;padding:20px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}

.brand{display:flex;gap:12px;align-items:center}
.logo{width:56px;height:56px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;color:white;font-weight:700}

h1{margin:0;font-size:22px}
.sub{color:var(--muted);font-size:13px}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.card{background:var(--card);padding:14px;border-radius:12px;
  box-shadow:0 6px 20px rgba(6,30,45,0.06)}

.col-4{grid-column:span 4}
.col-8{grid-column:span 8}
.col-12{grid-column:span 12}

.overview{display:flex;gap:12px}
.kpi{flex:1;padding:12px;border-radius:10px;background:rgba(255,255,255,0.55)}
.kpi h3{margin:0;font-size:14px;color:var(--muted)}
.kpi p{margin-top:8px;margin-bottom:0;font-weight:700;font-size:20px}

table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;text-align:left}
thead th{color:var(--muted);font-size:13px}
tbody tr{border-top:1px solid rgba(8,48,66,0.06)}

.controls{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
input,select{padding:9px;border-radius:8px;border:1px solid rgba(6,30,45,0.08);min-width:160px;width:100%}

button{padding:8px 14px;border-radius:8px;border:0;background:var(--accent);
color:white;cursor:pointer;font-size:14px}
button.alt{background:white;color:var(--accent);border:1px solid var(--accent)}

footer{text-align:center;margin-top:28px;font-size:13px;color:var(--muted)}

#ownerArea{display:none}
#memberList{padding:4px}

.owner-item{
  background:white;padding:10px;margin-bottom:8px;border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.05)
}

#withdrawModal{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,0.25);
  display:flex;align-items:center;justify-content:center;
}

#withdrawBox{
  background:white;padding:18px;border-radius:12px;max-width:420px;width:92%;
  box-shadow:0 10px 30px rgba(0,0,0,0.25)
}

/* MOBILE RESPONSIVE */
@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .col-4,.col-8,.col-12{grid-column:span 12}
  header{flex-direction:column;align-items:flex-start;gap:8px}
  .overview{flex-direction:column}
  input,select,button{width:100%}
}
</style>
</head>

<body>
<div class="container">

<header>
  <div class="brand">
    <div class="logo" id="logoTxt">AF</div>
    <div>
      <h1 id="title">Nama Member</h1>
      <div class="sub">Sistem uang berputar — localStorage (versi owner default)</div>
    </div>
  </div>

  <div style="text-align:right">
    <div id="balanceDisplay" style="font-weight:700;font-size:16px">Saldo: Rp0</div>
    <div class="sub">Status: <span id="withdrawStatus">Ready</span></div>
  </div>
</header>

<script>
/* ============================
   CONFIG & CONSTANTS
============================ */
const STORAGE_KEY = "affiliate_v3";
const COMMISSION = 150000;     // Komisi = 150.000
const OWNER_NAME = "distributorutama";  // Owner default
const TAX = 5000;

/* ============================
   LOAD DATABASE
============================ */
function loadDB() {
  let db = localStorage.getItem(STORAGE_KEY);
  if (!db) {
    db = { members:{}, logs:[], materials:[], withdraws:[] };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
    return db;
  }
  return JSON.parse(db);
}

function saveDB(db){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
}

/* ============================
   MEMBER HANDLING
============================ */
function ensureMemberRecord(name){
  const key = name.trim().toLowerCase();
  let db = loadDB();
  if (!db.members[key]) {
    db.members[key] = {
      name,
      clicks:0,
      sales:0,
      commission:0,
      history:[],
      payMethod:"",
      payAccount:"",
      links:[],
      balance:0
    };
  }
  saveDB(db);
  return key;
}

/* ============================
   INITIAL USER (OWNER DEFAULT)
============================ */
function getCurrentUser() {
  const url = new URL(window.location.href);
  let u = url.searchParams.get("user");

  if (!u || u.trim() === "") {
    // default = owner
    return OWNER_NAME;
  }

  return u.trim().toLowerCase();
}

let currentUser = getCurrentUser();
let currentKey = ensureMemberRecord(currentUser);

/* ============================
   RENDER PROFILE HEADER
============================ */
function renderHeader() {
  let db = loadDB();
  let me = db.members[currentKey];

  document.getElementById("title").innerText = me.name || currentUser;
  document.getElementById("logoTxt").innerText = (me.name || currentUser)
    .substring(0,2).toUpperCase();

  document.getElementById("balanceDisplay").innerText =
    "Saldo: Rp" + me.balance.toLocaleString();
}

/* ============================
   CREATE NEW MEMBER
============================ */
function createMember(){
  const name = document.getElementById("newMemberName").value.trim();
  if (!name) return alert("Nama tidak boleh kosong");

  const key = ensureMemberRecord(name);

  let db = loadDB();
  const base = window.location.origin + window.location.pathname;
  const url = `${base}?user=${key}`;

  db.members[key].links.push(url);
  saveDB(db);

  renderLinks();
  alert("Member berhasil dibuat!");
  document.getElementById("newMemberName").value = "";
}

/* ============================
   RENDER LIST LINK MEMBER
============================ */
function renderLinks(){
  let db = loadDB();
  let me = db.members[currentKey];

  let html = "";
  me.links.forEach(l => {
    html += `
      <div style="background:white;padding:10px;border-radius:8px;margin-top:8px">
        <strong>${me.name}</strong><br>
        <small>Link member baru:</small>
        <input style="width:100%;border:0;background:transparent" value="${l}" readonly>
      </div>`;
  });

  document.getElementById("linkList").innerHTML = html;
}

/* ============================
   PAYMENT SETTINGS
============================ */
function savePayment(){
  let db = loadDB();
  let me = db.members[currentKey];

  me.payMethod = document.getElementById("payMethod").value;
  me.payAccount = document.getElementById("payAccount").value.trim();

  saveDB(db);
  alert("Pengaturan pembayaran disimpan");
}

/* ============================
   DEMO DATA (Optional)
============================ */
function seedDemo(){
  let db = loadDB();
  let me = db.members[currentKey];

  me.clicks += 3;
  me.sales += 1;

  me.history.push({
    time: new Date().toLocaleString(),
    order:"DEMO123",
    fee:"Pajak Member Baru",
    amount:COMMISSION,
    status:"paid"
  });

  me.balance += COMMISSION;

  saveDB(db);
  renderAll();
  logAction(me.name + " menambahkan demo data");
}

/* ============================
   RESET DATA
============================ */
function resetData(){
  if (!confirm("Reset semua data untuk user ini?")) return;

  let db = loadDB();
  db.members[currentKey] = {
    name: currentUser,
    clicks:0,
    sales:0,
    commission:0,
    history:[],
    payMethod:"",
    payAccount:"",
    links:[],
    balance:0
  };

  saveDB(db);
  renderAll();
}

/* ============================
   LOG SYSTEM
============================ */
function logAction(text){
  let db = loadDB();
  db.logs.push(new Date().toLocaleString() + " — " + text);
  saveDB(db);
}

function renderLogs(){
  let db = loadDB();
  document.getElementById("logArea").innerHTML =
    db.logs.slice().reverse().join("<br>");
}

/* ============================
   WITHDRAW FLOW
============================ */
function openWithdraw(){
  document.getElementById("withdrawModal").style.display = "flex";
  document.getElementById("wdAccount").value = (loadDB().members[currentKey].payAccount || "");
}
function closeWithdraw(){
  document.getElementById("withdrawModal").style.display = "none";
}

function submitWithdraw(){
  const amt = Number(document.getElementById("wdAmount").value);
  const method = document.getElementById("wdMethod").value;
  const acc = document.getElementById("wdAccount").value.trim();

  if (!amt || amt <= 0) return alert("Masukkan jumlah withdraw yang valid.");
  if (!acc) return alert("Isi nomor rekening / DANA.");

  const db = loadDB();
  const me = db.members[currentKey];

  if ((me.balance || 0) < amt) return alert("Saldo tidak mencukupi.");

  const id = gen("WD");
  const req = {
    id,
    user: currentKey,
    name: me.name,
    amount: amt,
    fee: TAX,
    final: Math.max(0, amt - TAX),
    method,
    account: acc,
    status: "pending",
    time: new Date().toLocaleString()
  };

  db.withdraws.unshift(req);
  db.logs.push(new Date().toLocaleString() + " — " + me.name + " ajukan withdraw " + rupiah(amt));
  saveDB(db);

  closeWithdraw();
  renderAll();
  alert("Withdraw diajukan. Owner akan memproses secara manual.");
}

/* ============================
   OWNER ACTIONS
============================ */
function approveWithdraw(id){
  const db = loadDB();
  const i = db.withdraws.findIndex(w => w.id === id);
  if (i === -1) return alert("Request tidak ditemukan.");
  const w = db.withdraws[i];

  // find member and mark approved (owner will transfer manually)
  if (db.members[w.user]){
    // already deducted? we didn't deduct balance at request, so deduct now
    db.members[w.user].balance = Math.max(0, (db.members[w.user].balance || 0) - w.amount);
  }
  db.withdraws[i].status = "approved";
  db.withdraws[i].done = new Date().toLocaleString();
  db.logs.push(new Date().toLocaleString() + " — Owner approve withdraw " + w.id + " (" + w.name + ")");
  saveDB(db);
  renderAll();
  alert("Withdraw disetujui. Lakukan transfer manual sesuai data.");
}

function cancelWithdraw(id){
  if(!confirm("Batalkan request ini?")) return;
  const db = loadDB();
  const i = db.withdraws.findIndex(w => w.id === id);
  if(i === -1) return alert("Request tidak ditemukan.");
  db.withdraws[i].status = "cancelled";
  db.logs.push(new Date().toLocaleString() + " — Owner batalkan withdraw " + db.withdraws[i].id);
  saveDB(db);
  renderAll();
}

/* ============================
   RENDER OWNER PANEL + MEMBER LIST
============================ */
function renderOwnerPanel(){
  const db = loadDB();
  if (currentKey !== OWNER_NAME) {
    // hide owner area
    document.getElementById("ownerArea").style.display = "none";
    document.getElementById("ownerMembers").style.display = "none";
    return;
  }

  document.getElementById("ownerArea").style.display = "block";
  document.getElementById("ownerMembers").style.display = "block";

  // withdraws
  const panel = document.getElementById("ownerPanel");
  if (!db.withdraws || db.withdraws.length === 0){
    panel.innerHTML = "<div class='muted'>Belum ada withdraw</div>";
  } else {
    panel.innerHTML = db.withdraws.map(w => `
      <div style="padding:8px;border-bottom:1px solid #eee">
        <strong>${w.name}</strong><br>
        Amount: ${rupiah(w.amount)} — Final: ${rupiah(w.final)}<br>
        Metode: ${w.method} — Rek: ${w.account}<br>
        Status: ${w.status}<br>
        ${w.status === "pending" ? `<button onclick="approveWithdraw('${w.id}')">Approve</button>
        <button class="alt" onclick="cancelWithdraw('${w.id}')">Cancel</button>` : ''}
      </div>
    `).join("");
  }

  // members list & balances
  const memberPanel = document.getElementById("memberListPanel");
  const entries = Object.entries(db.members || {});
  if(entries.length === 0){
    memberPanel.innerHTML = "<div class='muted'>Belum ada member</div>";
  } else {
    memberPanel.innerHTML = entries.map(([k,m]) => `
      <div class="owner-item">
        <strong>${m.name}</strong><br>
        Saldo: ${rupiah(m.balance || 0)}<br>
        Total Komisi: ${rupiah((m.commissions || []).reduce((a,c)=>a+(c.jumlah||0),0))}<br>
        Transaksi: ${(m.commissions || []).length}<br>
        <small>Link referral:</small><br>
        <input style="width:100%;border:0;background:transparent;margin-top:6px" value="${location.origin + location.pathname + '?user=' + encodeURIComponent(k)}" readonly>
      </div>
    `).join("");
  }
}

/* ============================
   RENDER ALL
============================ */
function renderAll(){
  renderHeader();
  renderLogs();
  renderLinks();
  renderOwnerPanel();

  // commission table for current user (if any)
  const db = loadDB();
  const me = db.members[currentKey];
  // table already handled in renderLinks or header; ensure commissions shown
  const tbody = document.getElementById("commissionTable");
  if(!tbody) return;
  if(!me.commissions || me.commissions.length === 0){
    tbody.innerHTML = `<tr><td colspan="6" class="muted">Belum ada komisi</td></tr>`;
  } else {
    tbody.innerHTML = me.commissions.map(c => `
      <tr>
        <td data-label="Waktu">${c.time}</td>
        <td data-label="Order">${c.id}</td>
        <td data-label="Biaya">${c.biaya}</td>
        <td data-label="Jumlah">${rupiah(c.jumlah)}</td>
        <td data-label="Status"><span class="badge ${c.status}">${c.status}</span></td>
        <td data-label="Aksi"></td>
      </tr>`).join('');
  }
}

/* ============================
   UTILS: grant commission (when inviter buat member)
   - add commission record and increase balance
============================ */
function grantCommissionTo(userKey, fromName){
  const db = loadDB();
  const key = userKey.toLowerCase();
  ensureMemberRecord(key);
  if(!db.members[key].commissions) db.members[key].commissions = [];

  const rec = {
    id: gen("C"),
    time: new Date().toLocaleString(),
    biaya: "Pajak Member Baru",
    jumlah: COMMISSION,
    status: "paid",
    from: fromName
  };
  db.members[key].commissions.unshift(rec);
  db.members[key].balance = (db.members[key].balance || 0) + COMMISSION;
  db.logs.push(new Date().toLocaleString() + " — " + db.members[key].name + " dapat komisi dari " + fromName);
  saveDB(db);
}

/* Let's ensure createMember also grants commission to inviter (currentKey) */
function createMember(){
  const raw = document.getElementById("newMemberName").value.trim();
  if(!raw) return alert("Nama member baru harus diisi.");
  const name = raw;
  const key = name.toLowerCase().trim();
  const base = location.origin + location.pathname;
  const url = `${base}?user=${encodeURIComponent(key)}`;

  const db = loadDB();
  // ensure new member
  if(!db.members[key]) db.members[key] = { name: toDisplayName(name), clicks:0, sales:0, commission:0, history:[], payMethod:"", payAccount:"", links:[], balance:0, commissions:[] };
  db.members[key].links = db.members[key].links || [];
  db.members[key].links.unshift(url);

  // grant commission to current user (inviter)
  grantCommissionTo(currentKey, toDisplayName(name));

  db.logs.push(new Date().toLocaleString() + " — " + toDisplayName(currentKey) + " buat member " + toDisplayName(name));
  saveDB(db);
  document.getElementById("newMemberName").value = "";
  renderAll();
}

/* ============================
   INIT
============================ */
(function init(){
  // ensure owner exists
  ensureMemberRecord(OWNER_NAME);
  // ensure current exists
  ensureMemberRecord(currentUser);

  renderAll();
})();

/* ============================
   EXPORT / DEBUG
============================ */
function exportCSV(){
  const db = loadDB();
  const me = db.members[currentKey];
  const rows = [["time","order","biaya","jumlah","status"], ...((me.commissions||[]).map(c=>[c.time,c.id,c.biaya,c.jumlah,c.status]))];
  const csv = rows.map(r=>r.map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv],{type:'text/csv'}); const u = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = u; a.download = `commissions_${me.name.replace(/\s+/g,'_')}.csv`; a.click(); URL.revokeObjectURL(u);
}

/* expose functions for buttons */
window.createMember = createMember;
window.openWithdraw = openWithdraw;
window.closeWithdraw = closeWithdraw;
window.submitWithdraw = submitWithdraw;
window.savePayment = savePayment;
window.exportCSV = exportCSV;
window.seedDemo = seedDemo;
window.resetData = resetData;
window.approveWithdraw = approveWithdraw;
window.cancelWithdraw = cancelWithdraw;

</script>

</body>
</html>
